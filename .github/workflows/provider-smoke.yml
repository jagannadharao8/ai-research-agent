name: Verify configured Groq provider
# Exercises actual application routing and answer generation.
on:
  push:
    branches: [fix/research-provider-completions-20261028]
    paths: [.github/workflows/provider-smoke.yml]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install groq
      - name: Verify an actual model response without logging credentials
        if: env.GROQ_API_KEY != ''
        run: |
          python - <<'PY'
          from core.llm import complete, LLMError
          try:
              from app.rag_pipeline import is_general_query, prepare_rag, generate_with_reflection
              for question in [
                  "Explain precision and recall in binary classification in two sentences.",
                  "What is the difference between a Python list and a tuple?",
                  "Define overfitting in two sentences."
              ]:
                  assert is_general_query(question), 'Stable concept did not select DIRECT'
                  prompt, sources, mode = prepare_rag(question)
                  assert mode == "Direct", "Basic concept unexpectedly routed to search"
                  answer, review = generate_with_reflection(prompt, sources)
                  assert len(answer) > 30, "Missing application answer"
              print("Three real application queries completed with routing and answers.")
              print("Configured Groq model returned a valid live response.")
          except LLMError as exc:
              raise SystemExit(str(exc))
          PY
      - name: Report missing deployment credential
        if: env.GROQ_API_KEY == ''
        run: |
          echo "Live verification unavailable: no repository Groq secret is configured."
          exit 1
